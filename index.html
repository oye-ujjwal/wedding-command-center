<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ujjwal & Khushbu | Wedding Command Center</title>
<style>
:root{--bg:#f7f5f1;--ink:#25233a;--muted:#77758a;--accent:#7c4dff;--card:#fff;--line:#e8e5ee}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial;background:var(--bg);color:var(--ink)}
header{padding:24px 5%;background:linear-gradient(120deg,#30264e,#7854a8);color:white}header h1{margin:0;font-size:clamp(22px,4vw,34px)}header p{margin:8px 0 0;color:#e8dcff}
.layout{display:grid;grid-template-columns:250px 1fr;gap:20px;padding:20px 4%;max-width:1400px;margin:auto}
aside,.panel,.task{background:var(--card);border-radius:16px;padding:18px;box-shadow:0 5px 24px #29204b0a}
aside h3{margin-top:0}.folder{display:flex;justify-content:space-between;align-items:center;padding:10px;border-radius:10px;cursor:pointer;margin:4px 0}.folder.active,.folder:hover{background:#f0eaff;color:var(--accent)}
main{min-width:0}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0}.stat{background:white;border-radius:14px;padding:16px}.stat small{color:var(--muted)}.stat strong{display:block;font-size:28px;margin-top:6px}
button{border:0;border-radius:10px;padding:10px 14px;background:var(--accent);color:white;font-weight:650;cursor:pointer}button.secondary{background:#eee9fa;color:#48376d}button.danger{background:#fff0f0;color:#b42318}input,select,textarea{padding:10px;border:1px solid var(--line);border-radius:10px;width:100%;font:inherit;background:white}textarea{resize:vertical;min-height:65px}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.task{margin:12px 0;padding:16px}.taskhead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.task h3{margin:0 0 8px}.meta{font-size:13px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap}.badge{padding:4px 9px;border-radius:20px;background:#eee;color:#555;font-size:12px}.badge.Completed{background:#dcfce7;color:#166534}.badge.In-Progress{background:#ffedd5;color:#9a3412}.badge.Pending{background:#eee9fa;color:#55339a}.taskactions{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.comments{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}.comment{padding:9px;background:#f8f7fb;border-radius:9px;margin:8px 0;font-size:14px}.comment small{color:var(--muted)}.hidden{display:none}.empty{color:var(--muted);padding:24px;text-align:center}
@media(max-width:760px){.layout{grid-template-columns:1fr;padding:14px}.stats{gap:7px}.stat{padding:12px}.formgrid{grid-template-columns:1fr}header{padding:20px}}
</style></head><body>
<header><h1>💍 Ujjwal & Khushbu — Wedding Command Center</h1><p>One place to organize every wedding detail.</p></header>
<div class="layout"><aside><h3>📁 Events & Folders</h3><div id="folders"></div><div style="display:flex;gap:8px;margin-top:12px"><input id="folderName" placeholder="New event/folder"><button onclick="addFolder()">+</button></div><p style="font-size:12px;color:#777">Create folders for Haldi, Sangeet, Wedding, Reception and more.</p></aside>
<main><div class="panel"><div class="top"><div><h2 id="currentTitle" style="margin:0">All Tasks</h2><small>Manage deadlines, assignments and notes</small></div><button onclick="openTaskForm()">＋ New Task</button></div>
<div class="stats"><div class="stat"><small>Total Tasks</small><strong id="total">0</strong></div><div class="stat"><small>Completed</small><strong id="completed">0</strong></div><div class="stat"><small>Pending / In progress</small><strong id="open">0</strong></div></div>
<div class="formgrid"><input id="search" placeholder="Search tasks..." oninput="renderTasks()"><select id="filter" onchange="renderTasks()"><option value="">All statuses</option><option>Pending</option><option>In Progress</option><option>Completed</option></select></div>
</div><div id="taskForm" class="panel hidden" style="margin-top:12px"><h3 id="formTitle">Create task</h3><div class="formgrid"><input id="taskName" placeholder="Task title"><input id="assigned" placeholder="Assigned to"><input id="deadline" type="date"><select id="status"><option>Pending</option><option>In Progress</option><option>Completed</option></select></div><textarea id="taskDescription" placeholder="Details / notes" style="margin-top:10px"></textarea><div style="display:flex;gap:8px;margin-top:10px"><button onclick="saveTask()">Save task</button><button class="secondary" onclick="closeForm()">Cancel</button></div></div>
<div id="tasks"></div></main></div>
<script>
const defaultFolders=["Haldi","Sangeet","Wedding","Reception","Other"];
let data=JSON.parse(localStorage.getItem("wcm_data")||"null")||{folders:defaultFolders,tasks:[]};
let selected="All Tasks",editId=null;
function persist(){localStorage.setItem("wcm_data",JSON.stringify(data))}
function renderFolders(){let el=document.getElementById("folders");el.innerHTML="";["All Tasks",...data.folders].forEach(f=>{let d=document.createElement("div");d.className="folder "+(selected===f?"active":"");d.innerHTML=`<span>${f==="All Tasks"?"📋":"📁"} ${esc(f)}</span><span>${f==="All Tasks"?data.tasks.length:data.tasks.filter(t=>t.folder===f).length}</span>`;d.onclick=()=>{selected=f;render()};el.appendChild(d)})}
function addFolder(){let n=document.getElementById("folderName").value.trim();if(!n)return;if(data.folders.includes(n)){alert("Folder already exists");return}data.folders.push(n);document.getElementById("folderName").value="";persist();render()}
function openTaskForm(id=null){editId=id;let t=data.tasks.find(x=>x.id===id);document.getElementById("formTitle").textContent=t?"Edit task":"Create task";document.getElementById("taskName").value=t?.name||"";document.getElementById("assigned").value=t?.assigned||"";document.getElementById("deadline").value=t?.deadline||"";document.getElementById("status").value=t?.status||"Pending";document.getElementById("taskDescription").value=t?.description||"";document.getElementById("taskForm").classList.remove("hidden")}
function closeForm(){document.getElementById("taskForm").classList.add("hidden");editId=null}
function saveTask(){let name=document.getElementById("taskName").value.trim();if(!name){alert("Please enter task title");return}let t={name,assigned:document.getElementById("assigned").value,deadline:document.getElementById("deadline").value,status:document.getElementById("status").value,description:document.getElementById("taskDescription").value,folder:selected==="All Tasks"?"Other":selected,comments:[]};if(editId){let old=data.tasks.find(x=>x.id===editId);Object.assign(old,t)}else{t.id=crypto.randomUUID();data.tasks.unshift(t)}persist();closeForm();render()}
function addComment(id){let t=data.tasks.find(x=>x.id===id);let text=document.getElementById("comment-"+id).value.trim();if(!text)return;t.comments.push({id:crypto.randomUUID(),text,created:new Date().toLocaleString()});persist();renderTasks()}
function editComment(taskId,commentId){let c=data.tasks.find(t=>t.id===taskId).comments.find(c=>c.id===commentId);let text=prompt("Edit comment:",c.text);if(text===null)return;c.text=text.trim();persist();renderTasks()}
function deleteComment(taskId,commentId){if(!confirm("Delete this comment?"))return;let t=data.tasks.find(t=>t.id===taskId);t.comments=t.comments.filter(c=>c.id!==commentId);persist();renderTasks()}
function deleteTask(id){if(!confirm("Delete this task?"))return;data.tasks=data.tasks.filter(t=>t.id!==id);persist();render()}
function changeStatus(id,status){data.tasks.find(t=>t.id===id).status=status;persist();renderTasks()}
function renderTasks(){let search=document.getElementById("search").value.toLowerCase(),filter=document.getElementById("filter").value;let tasks=data.tasks.filter(t=>(selected==="All Tasks"||t.folder===selected)&&(!search||[t.name,t.assigned,t.description,t.folder].join(" ").toLowerCase().includes(search))&&(!filter||t.status===filter));document.getElementById("tasks").innerHTML=tasks.length?tasks.map(t=>`<article class="task"><div class="taskhead"><div><h3>${esc(t.name)}</h3><div class="meta"><span>📁 ${esc(t.folder)}</span><span>👤 ${esc(t.assigned||"Unassigned")}</span><span>📅 ${esc(t.deadline||"No deadline")}</span></div></div><span class="badge ${t.status.replaceAll(" ","-")}">${esc(t.status)}</span></div>${t.description?`<p>${esc(t.description)}</p>`:""}<div style="margin-top:10px"><select onchange="changeStatus('${t.id}',this.value)"><option ${t.status==="Pending"?"selected":""}>Pending</option><option ${t.status==="In Progress"?"selected":""}>In Progress</option><option ${t.status==="Completed"?"selected":""}>Completed</option></select></div><div class="taskactions"><button class="secondary" onclick="openTaskForm('${t.id}')">✏️ Edit</button><button class="danger" onclick="deleteTask('${t.id}')">Delete</button></div><div class="comments"><strong>💬 Comments (${t.comments.length})</strong>${t.comments.map(c=>`<div class="comment">${esc(c.text)}<br><small>${esc(c.created||"")}</small><div class="taskactions"><button class="secondary" onclick="editComment('${t.id}','${c.id}')">Edit</button><button class="danger" onclick="deleteComment('${t.id}','${c.id}')">Delete</button></div></div>`).join("")}<div style="display:flex;gap:8px;margin-top:8px"><input id="comment-${t.id}" placeholder="Add a comment or update"><button onclick="addComment('${t.id}')">Add</button></div></div></article>`).join(""):`<div class="empty">No tasks here yet. Click <b>New Task</b> to add one.</div>`;let scope=data.tasks.filter(t=>selected==="All Tasks"||t.folder===selected);document.getElementById("total").textContent=scope.length;document.getElementById("completed").textContent=scope.filter(t=>t.status==="Completed").length;document.getElementById("open").textContent=scope.filter(t=>t.status!=="Completed").length}
function esc(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function render(){renderFolders();document.getElementById("currentTitle").textContent=selected;renderTasks()}
render();
</script></body></html>
